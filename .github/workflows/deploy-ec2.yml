name: Build And Deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-santa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, Build And Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.8.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            lambdas/emailer/package-lock.json
      - name: Install Locked Dependencies
        run: |
          npm ci --include=dev
          npm --prefix frontend ci --include=dev
          npm --prefix lambdas/emailer ci --include=dev
      - name: Validate Deployment Scripts
        run: |
          bash -n terraform/scripts/bootstrap-ec2.sh
          bash -n terraform/scripts/deploy-release.sh
      - name: Test Backend And Frontend
        run: |
          npm test -- --ci --runInBand --coverage
          npm --prefix frontend run test:coverage -- --ci --runInBand
      - name: Create Temporary Build Certificates
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/build-key.pem" -out "$RUNNER_TEMP/build-cert.pem" \
            -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          printf 'SSL_KEY_PATH=%s\nSSL_CERT_PATH=%s\n' \
            "$RUNNER_TEMP/build-key.pem" "$RUNNER_TEMP/build-cert.pem" >> "$GITHUB_ENV"
      - name: Build Backend And Frontend
        run: |
          npm run build
          npm --prefix frontend run build
      - name: Package Exact Commit
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/package"
          git archive "$GITHUB_SHA" package.json package-lock.json tsconfig.json \
            backend/src frontend terraform/scripts | tar -xf - -C "$RUNNER_TEMP/release"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release/REVISION"
          tar -czf "$RUNNER_TEMP/package/release.tar.gz" -C "$RUNNER_TEMP/release" .
          printf 'checksum=%s\n' "$(sha256sum "$RUNNER_TEMP/package/release.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ec2-release-${{ github.sha }}
          path: ${{ runner.temp }}/package/release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      RELEASE_CHECKSUM: ${{ needs.build.outputs.checksum }}
    steps:
      - name: Validate Deployment Configuration
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const checks = {
            AWS_REGION: /^[a-z0-9-]+$/,
            AWS_ROLE_ARN: /^arn:aws:iam::[0-9]{12}:role\/[A-Za-z0-9+=,.@_/-]+$/,
            EC2_INSTANCE_ID: /^i-(?:[0-9a-f]{8}|[0-9a-f]{17})$/,
            DEPLOY_BUCKET: /^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$/,
            RELEASE_CHECKSUM: /^[0-9a-f]{64}$/,
          };
          for (const [name, pattern] of Object.entries(checks)) {
            assert.match(process.env[name] || '', pattern, `Set a valid production environment variable: ${name}`);
          }
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: ec2-release-${{ github.sha }}
          path: ${{ runner.temp }}/package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: secret-santa-${{ github.run_id }}
      - name: Upload Release And Prepare SSM Command
        run: |
          printf '%s  %s\n' "$RELEASE_CHECKSUM" "$RUNNER_TEMP/package/release.tar.gz" | sha256sum --check -
          export RELEASE_KEY="releases/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/release.tar.gz"
          aws s3 cp "$RUNNER_TEMP/package/release.tar.gz" "s3://$DEPLOY_BUCKET/$RELEASE_KEY" \
            --sse AES256 --only-show-errors
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const {DEPLOY_BUCKET, RELEASE_KEY, RELEASE_CHECKSUM, AWS_REGION, GITHUB_SHA, RUNNER_TEMP} = process.env;
          assert.match(GITHUB_SHA, /^[0-9a-f]{40}$/);
          assert.match(RELEASE_KEY, /^releases\/[0-9a-f]{40}\/[0-9]+-[0-9]+\/release\.tar\.gz$/);
          const commands = [
            'set -eu',
            'export PATH=/usr/local/bin:/usr/bin:/bin',
            'umask 077',
            'release_dir=$(mktemp -d /var/tmp/secret-santa-release.XXXXXX)',
            'trap \'rm -rf "$release_dir"\' EXIT',
            `aws s3 cp 's3://${DEPLOY_BUCKET}/${RELEASE_KEY}' "$release_dir/release.tar.gz" --region '${AWS_REGION}' --only-show-errors`,
            `printf '%s  %s\\n' '${RELEASE_CHECKSUM}' "$release_dir/release.tar.gz" | sha256sum --check -`,
            'mkdir "$release_dir/source"',
            'tar -xzf "$release_dir/release.tar.gz" -C "$release_dir/source" --no-same-owner --no-same-permissions',
            `bash "$release_dir/source/terraform/scripts/deploy-release.sh" "$release_dir/source" '${GITHUB_SHA}'`,
          ];
          fs.writeFileSync(`${RUNNER_TEMP}/ssm-parameters.json`, JSON.stringify({commands, executionTimeout: ['1800']}));
          NODE
      - name: Run Deployment And Wait For Completion
        run: |
          command_id="$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 120 \
            --comment "Deploy Secret Santa $GITHUB_SHA" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query Command.CommandId --output text)"
          printf 'SSM command: %s\n' "$command_id"
          completed=false
          for attempt in {1..22}; do
            if aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"; then
              completed=true
              break
            fi
            invocation="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --output json)"
            case "$(jq -r '.Status' <<< "$invocation")" in
              Success) completed=true; break ;;
              Pending|InProgress|Delayed) continue ;;
              *) jq -r '.Status, .StandardOutputContent, .StandardErrorContent' <<< "$invocation"; exit 1 ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          if [[ "$completed" != true ]]; then
            printf 'SSM deployment did not complete within the workflow deadline.\n' >&2
            exit 1
          fi
      - name: Verify Public HTTPS Endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            https://secretsanta.reinhardtvanwyk.com/ -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            https://secretsanta.reinhardtvanwyk.com/api/health | jq -e '.status == "ok"'